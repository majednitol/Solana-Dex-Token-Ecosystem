# ── Backend upstream pool (round-robin by default) ──────────────────────────
upstream backend_pool {
    server backend1:8080;
    server backend2:8080;
    server backend3:8080;
    keepalive 32;
}

# ── SSE-specific upstream (ip_hash ensures sticky sessions for EventSource) ──
upstream backend_sse {
    ip_hash;
    server backend1:8080;
    server backend2:8080;
    server backend3:8080;
}

# ── HTTP Redirect to HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    server_name cryptoniteswap.xyz www.cryptoniteswap.xyz;

    # Automatically upgrade insecure traffic to TLS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server Block ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name cryptoniteswap.xyz www.cryptoniteswap.xyz;

    # SSL Certificates (managed by Certbot on host machine)
    ssl_certificate /etc/letsencrypt/live/cryptoniteswap.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptoniteswap.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Frontend static assets ───────────────────────────────────────────────
    location / {
        # Offload delivery to containerized frontend which handles missing routes
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE real-time stream (sticky via ip_hash) ────────────────────────────
    location /api/chart/stream {
        proxy_pass http://backend_sse/api/chart/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires buffering to be disabled
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── API load balanced (round-robin) ──────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Uploaded files ───────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend_pool/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
